<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pastaPlanetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1c14"/>
      <stop offset="50%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#090a0e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#pastaPlanetBg)"/>

  <!-- Italian Wine Barrels & Trattoria Shelves -->
  <g stroke="#DFB76C" stroke-width="1.5" opacity="0.6">
    <ellipse cx="140" cy="270" rx="40" ry="60" fill="#231913"/>
    <ellipse cx="460" cy="270" rx="40" ry="60" fill="#231913"/>
  </g>
  
  <!-- Pasta Fork Glow -->
  <circle cx="300" cy="200" r="50" fill="#DFB76C" opacity="0.1" filter="blur(15px)"/>
  <ellipse cx="300" cy="220" rx="80" ry="25" fill="#1c1c28" stroke="#DFB76C" stroke-width="2"/>

  <!-- Signboard -->
  <rect x="200" y="30" width="200" height="46" rx="10" fill="#14141c" stroke="#DFB76C" stroke-width="2"/>
  <text x="300" y="58" fill="#DFB76C" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">PASTA PLANET</text>
</svg>
