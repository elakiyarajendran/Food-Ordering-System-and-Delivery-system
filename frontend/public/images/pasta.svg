<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="pastaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222018"/>
      <stop offset="100%" stop-color="#121218"/>
    </radialGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="alfredoCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="bowlShadow">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="36" fill="url(#pastaBg)"/>

  <!-- Gourmet Black Ceramic Bowl -->
  <g filter="url(#bowlShadow)">
    <circle cx="250" cy="250" r="180" fill="url(#bowlGrad)" stroke="#DFB76C" stroke-width="2.5"/>
    <circle cx="250" cy="250" r="145" fill="#171923"/>

    <!-- Fettuccine Ribbons Swirl -->
    <g fill="none" stroke="url(#alfredoCream)" stroke-linecap="round">
      <path d="M190 200 C170 260, 290 280, 270 210 C250 160, 320 180, 310 240 C300 290, 210 300, 190 230" stroke-width="18"/>
      <path d="M220 180 C280 170, 330 220, 280 260 C230 300, 170 240, 210 200 C240 170, 290 200, 270 250" stroke-width="16"/>
      <path d="M170 220 C180 290, 260 310, 310 260 C350 220, 280 180, 240 210 C210 230, 230 270, 260 260" stroke-width="15"/>
      <path d="M230 220 C270 210, 300 240, 260 270 C220 290, 200 240, 230 220" stroke-width="14"/>
    </g>

    <!-- Grilled Herb Chicken / Mushroom Chunks -->
    <g>
      <rect x="230" y="210" width="35" height="24" rx="6" fill="#D97706" transform="rotate(15 230 210)"/>
      <rect x="180" y="240" width="38" height="22" rx="6" fill="#B45309" transform="rotate(-25 180 240)"/>
      <rect x="280" y="235" width="34" height="25" rx="6" fill="#D97706" transform="rotate(35 280 235)"/>
      <rect x="240" y="260" width="36" height="22" rx="6" fill="#B45309" transform="rotate(-10 240 260)"/>
    </g>

    <!-- Chopped Italian Parsley & Cracked Pepper -->
    <g fill="#15803D">
      <circle cx="210" cy="190" r="3"/>
      <circle cx="250" cy="180" r="3.5"/>
      <circle cx="290" cy="210" r="2.8"/>
      <circle cx="225" cy="245" r="3"/>
      <circle cx="270" cy="240" r="3.5"/>
      <circle cx="205" cy="280" r="2.8"/>
      <circle cx="250" cy="290" r="3.2"/>
      <circle cx="310" cy="260" r="2.5"/>
    </g>
    <g fill="#1F2937">
      <circle cx="230" cy="195" r="1.5"/>
      <circle cx="275" cy="190" r="1.5"/>
      <circle cx="215" cy="235" r="1.8"/>
      <circle cx="295" cy="230" r="1.5"/>
      <circle cx="245" cy="275" r="1.6"/>
    </g>

    <!-- Shaved Parmesan Curl -->
    <path d="M220 185 Q260 170 270 195 Q250 205 220 185 Z" fill="#FEFCE8" opacity="0.95"/>
  </g>

  <!-- Sparkles -->
  <polygon points="410,110 414,122 426,126 414,130 410,142 406,130 394,126 406,122" fill="#DFB76C"/>
</svg>
