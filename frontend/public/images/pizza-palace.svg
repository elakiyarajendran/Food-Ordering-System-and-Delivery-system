<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pizzeriaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1610"/>
      <stop offset="60%" stop-color="#1c1210"/>
      <stop offset="100%" stop-color="#0e0a0a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#pizzeriaBg)"/>

  <!-- Brick Wall Texture -->
  <g stroke="#3D2018" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
  </g>

  <!-- Woodfired Brick Oven with Fire Glow -->
  <path d="M180 360 L180 200 Q300 100 420 200 L420 360 Z" fill="#26150F" stroke="#DFB76C" stroke-width="2"/>
  <path d="M220 360 L220 230 Q300 160 380 230 L380 360 Z" fill="#140906"/>
  <!-- Glowing Burning Embers -->
  <ellipse cx="300" cy="330" rx="60" ry="20" fill="#EA580C" opacity="0.8"/>
  <circle cx="300" cy="320" r="30" fill="#FBBF24" opacity="0.6" filter="blur(6px)"/>

  <!-- Golden Pizzeria Signboard -->
  <rect x="200" y="30" width="200" height="46" rx="10" fill="#181824" stroke="#DFB76C" stroke-width="2"/>
  <text x="300" y="58" fill="#DFB76C" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">PIZZA PALACE</text>
</svg>
