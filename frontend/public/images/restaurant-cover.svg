<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241b12"/>
      <stop offset="40%" stop-color="#18151f"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="chandelier" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#CA8A04" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#coverBg)"/>

  <!-- Chandelier lights -->
  <ellipse cx="300" cy="80" rx="200" ry="120" fill="url(#chandelier)"/>
  <ellipse cx="600" cy="80" rx="250" ry="140" fill="url(#chandelier)"/>
  <ellipse cx="900" cy="80" rx="200" ry="120" fill="url(#chandelier)"/>

  <!-- Architectural Columns -->
  <g fill="#161622" stroke="#DFB76C" stroke-width="1.5" opacity="0.6">
    <rect x="80" y="80" width="45" height="420" rx="4"/>
    <rect x="360" y="80" width="45" height="420" rx="4"/>
    <rect x="790" y="80" width="45" height="420" rx="4"/>
    <rect x="1070" y="80" width="45" height="420" rx="4"/>
  </g>

  <!-- Luxury Restaurant Tables & Chairs -->
  <g fill="#1f1f2e" stroke="#DFB76C" stroke-width="1.5">
    <ellipse cx="300" cy="380" rx="110" ry="35"/>
    <ellipse cx="600" cy="360" rx="140" ry="40"/>
    <ellipse cx="900" cy="380" rx="110" ry="35"/>
  </g>
</svg>
